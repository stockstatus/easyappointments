# ═══════════════════════════════════════════════════════════
# Masáže Karin — ladenie Apache
#
# Dôvod: 2. 9. 2026 o 02:40 server ohlásil
#
#   AH00161: server reached MaxRequestWorkers setting
#
# a od 02:40 do 04:39 prestal odpovedať — v čase, keď nikto
# nerezervoval. Nešlo teda o záťaž od klientok.
#
# Predvolené hodnoty Debianu sú na kontajner s jednou PHP
# aplikáciou nevhodné: zaseknutá požiadavka držala worker
# celých 300 sekúnd, takže sa ich pri nízkej prevádzke postupne
# nazbieralo 150 a server prestal prijímať čokoľvek ďalšie.
# ═══════════════════════════════════════════════════════════

# Bolo 300 s. Päť minút na jednu požiadavku nemá v tejto aplikácii
# opodstatnenie — najpomalšia operácia (vytvorenie rezervácie
# s odoslaním e-mailov) trvá do 10 sekúnd. Zaseknuté spojenia sa
# teraz uvoľnia päťkrát rýchlejšie.
Timeout 60

# Bolo 5 s. Pri prefork MPM drží každé nečinné keep-alive spojenie
# celý worker. Aplikácia navyše väčšinu volaní robí strojovo
# (Spring, monitor), kde sa spojenia nerecyklujú.
KeepAliveTimeout 2

<IfModule mpm_prefork_module>
    # Bolo 150. Kontajner má 24 GB pamäte, takže priestor je;
    # pri prefork zaberie každý potomok rádovo desiatky MB.
    ServerLimit             250
    MaxRequestWorkers       250

    # Bolo 5 a 10. Vyššia pohotovostná rezerva znamená, že Apache
    # nemusí procesy pri každom náraze zakladať odznova — a menej
    # ich aj likviduje, čo by malo utíšiť tú záplavu hlášok
    # "internal dummy connection" každú sekundu.
    StartServers            10
    MinSpareServers         10
    MaxSpareServers         30

    # Recyklácia potomkov po 1000 požiadavkách. Chráni pred
    # postupným narastaním pamäte v PHP procesoch.
    MaxConnectionsPerChild  1000
</IfModule>

# Prísnejšie než predvolené header=20-40. Klient, ktorý otvorí
# spojenie a nepošle hlavičky, obsadzuje worker zbytočne.
<IfModule reqtimeout_module>
    RequestReadTimeout header=10-20,minrate=500
    RequestReadTimeout body=20,minrate=500
</IfModule>

# ═══════════════════════════════════════════════════════════
# Diagnostika: prehľad workerov
#
# Pri výpadku 2. 9. 2026 sme vedeli, ŽE sa workery vyčerpali
# (AH00161), ale nie ČÍM. Databáza bola vylúčená (špička 11
# spojení zo 151), pamäť aj CPU tiež (24 GB / 24 vCPU), a išlo
# o 2:40 v noci, keď nikto nerezervoval.
#
# Táto stránka ukáže pri ďalšom náraze živý zoznam workerov:
# akú adresu obsluhujú, z akej IP a ako dlho už. To otázku
# zodpovie priamo namiesto ďalšieho kola dohadov.
#
# POZOR — bezpečnostný kompromis:
# Cesta je zámerne neuhádnuteľná, ale nie je chránená heslom.
# Všetka prevádzka na Railway prichádza z rozsahu 100.64.0.0/10
# (interný proxy), takže obmedzenie podľa IP by verejný prístup
# neodfiltrovalo — vyzeralo by rovnako ako ten interný.
#
# Stránka neodhaľuje žiadne prihlasovacie údaje, len adresy
# a IP práve spracúvaných požiadaviek. Napriek tomu ju po
# vyriešení príčiny ODSTRÁŇ — nemá byť trvalou súčasťou.
# ═══════════════════════════════════════════════════════════

ExtendedStatus On

<IfModule status_module>
    <Location "/kn-diag-w7q2xr">
        SetHandler server-status
        Require all granted
    </Location>
</IfModule>
